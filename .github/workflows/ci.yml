# CI
# ---
# Two separate jobs, on purpose, matching the two kinds of test in this
# repo (see the "Measuring accuracy" and "Known limitations" sections of
# README.md):
#
#   unit-tests  - tests/test_tools.py against tools.py's functions directly.
#                 Stdlib only, no API key, no network, seconds to run - so
#                 it runs automatically on every push and pull request.
#
#   evals       - evals/run_evals.py, the golden-task harness. Spawns a
#                 real `python main.py` subprocess and makes real Anthropic
#                 API calls - it costs actual money and time, so it does
#                 NOT run automatically. It only runs when someone manually
#                 triggers it from the Actions tab ("Run workflow"), and
#                 only if this repo has an ANTHROPIC_API_KEY secret set
#                 (Settings -> Secrets and variables -> Actions). Without
#                 that secret the job still runs but run_evals.py will fail
#                 on its first API call - that's expected, not a CI bug.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (tools.py, in isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No `pip install` step here on purpose - tools.py and
      # tests/test_tools.py only import the standard library, so this job
      # doesn't need requirements.txt (anthropic, python-dotenv) at all.
      - name: Run tests/test_tools.py
        run: python -m unittest discover -s tests -t . -v

  evals:
    name: Golden-task evals (manual only, costs real API credit)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run evals/run_evals.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_APPROVE_BASH: "true"
        run: python evals/run_evals.py
